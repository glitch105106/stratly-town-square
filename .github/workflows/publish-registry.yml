name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry (GitHub OIDC, no stored secret)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        id: publish
        run: |
          set +e
          ./mcp-publisher publish > /tmp/publish.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/publish.log
          test "$(grep -c . /tmp/publish.log || true)" -gt 0

      - name: Report publish result to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="registry publish: exit ${{ steps.publish.outputs.exit_code }} (run ${{ github.run_id }})"
          gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file /tmp/publish.log || \
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "(publish log was empty)"
